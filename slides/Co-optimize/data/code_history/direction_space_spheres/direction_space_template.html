<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ · 退出方向</title><style>body{font:16px system-ui;margin:24px;color:#243044;background:#f7f9fc}h1{font-size:24px}p{line-height:1.6}button,select{font:inherit;padding:8px 14px;border:1px solid #ccd4df;border-radius:8px;background:white;cursor:pointer;margin:4px}button.active{background:#253650;color:white}.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border-radius:14px;padding:18px;box-shadow:0 2px 12px #0001}canvas{width:100%;height:auto;touch-action:none}h2{font-size:18px;margin:0 0 8px}small{color:#58667a}a{color:#2676c7}#legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}@media(max-width:900px){.panels{grid-template-columns:1fr}}</style><h1>__TITLE__ · 退出方向空间</h1><p id="status"></p><div id="controls"></div><div id="legend"></div><div class="panels"><div class="card"><h2>同一物体坐标系中的半球</h2><small>拖动旋转。彩色圆弧是各 pose 的半球边界；黑星是参考方向。</small><canvas id="sphere" width="800" height="700"></canvas></div><div class="card"><h2>参考方向附近的放大图</h2><small>彩色线是半球边界，点是该 pose 选出的最近合法方向。绿色表示所有 pose 共同允许的区域。</small><canvas id="zoom" width="800" height="700"></canvas></div></div><p>每个半球满足 nᵢ·d ≥ 0：物体沿这个方向移动不会进入它自己的地面。无共同方向时，选择尽量靠近同一参考方向的各 pose 合法方向。这里展示方向初始化，不检查承载或退出扫掠占用。</p><p><a href="direction_space.png">下载静态图</a> · <a href="data/direction_space.json">方向与证明数据</a></p><script>
const data=__DATA__,r=data.record,C=data.colors,N=r.normals_fixture,D=r.directions_fixture,R=r.reference_direction;
const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{let l=Math.hypot(...a);return a.map(v=>v/l)},rad=x=>x*Math.PI/180;
const A=document.querySelector('#sphere'),B=document.querySelector('#zoom'),ctx=A.getContext('2d'),q=B.getContext('2d');let az=Math.atan2(R[1],R[0]),el=Math.asin(R[2]),selected=-1;
document.querySelector('#status').textContent=(r.common_direction_exists?'有共同退出方向。':'没有非零共同退出方向（LP 证明）。')+' 所选方向两两最大夹角 '+r.maximum_pair_angle_deg.toFixed(3)+'°。';
const controls=document.querySelector('#controls');['重叠区域',...r.poses.map(p=>p.replace('_',' '))].forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>{selected=i-1;document.querySelectorAll('button').forEach((x,j)=>x.classList.toggle('active',i===j));draw()};if(!i)b.classList.add('active');controls.append(b)});
document.querySelector('#legend').innerHTML=r.poses.map((p,i)=>'<span style="color:'+C[i]+'">● '+p.replace('_',' ')+'</span>').join('')+'<span>★ 参考方向</span>';
const palette=['#f0f2f5','#fae6a6','#b6dbe1','#71abc9','#4871a6','#384f8c','#23b66b'];palette[N.length]='#23b66b';
const tris=[];for(let j=0;j<data.sphere.length-1;j++)for(let k=0;k<data.sphere[0].length-1;k++){let a=data.sphere[j][k],b=data.sphere[j+1][k],c=data.sphere[j+1][k+1],d=data.sphere[j][k+1];for(let t of [[a,b,c],[a,c,d]]){let m=norm(t[0].map((_,i)=>(t[0][i]+t[1][i]+t[2][i])/3));tris.push({t,m,count:N.filter(n=>dot(n,m)>=0).length})}}
function camera(){let f=[Math.cos(el)*Math.cos(az),Math.cos(el)*Math.sin(az),Math.sin(el)],u=[-Math.sin(az),Math.cos(az),0],v=cross(f,u);return{f,u,v}}function point(p,cam){return[400+285*dot(p,cam.u),350-285*dot(p,cam.v)]}function circle(c,p,size,color){c.beginPath();c.arc(...p,size,0,2*Math.PI);c.fillStyle=color;c.fill()}function star(c,p){c.fillStyle='#202833';c.font='26px system-ui';c.fillText('★',p[0]-12,p[1]+9)}
function drawSphere(){ctx.clearRect(0,0,800,700);let cam=camera();let visible=tris.filter(t=>dot(t.m,cam.f)>0).sort((a,b)=>dot(a.m,cam.f)-dot(b.m,cam.f));for(let t of visible){let color=selected<0?palette[t.count]:(dot(N[selected],t.m)>=0?C[selected]:'#eff1f5');ctx.globalAlpha=selected<0?.85:.45;ctx.fillStyle=color;ctx.beginPath();t.t.forEach((p,i)=>{let v=point(p,cam);i?ctx.lineTo(...v):ctx.moveTo(...v)});ctx.closePath();ctx.fill()}ctx.globalAlpha=1;data.boundaries.forEach((line,i)=>{ctx.strokeStyle=C[i];ctx.lineWidth=selected===i?3:1.4;for(let k=1;k<line.length;k++){let a=line[k-1],b=line[k];ctx.globalAlpha=dot(a,cam.f)>=0?1:.18;ctx.beginPath();ctx.moveTo(...point(a,cam));ctx.lineTo(...point(b,cam));ctx.stroke()}});ctx.globalAlpha=1;D.forEach((d,i)=>{let p=point(d,cam);circle(ctx,p,6,C[i]);ctx.fillStyle=C[i];ctx.font='15px system-ui';ctx.fillText(r.poses[i].replace('pose_',''),p[0]+9,p[1]+i*12)});star(ctx,point(R,cam));ctx.fillStyle='#58667a';ctx.font='15px system-ui';ctx.fillText(selected<0?'球面颜色 = 允许这个方向的 pose 数（绿色 = 全部）':'彩色区域 = '+r.poses[selected]+' 的合法半球',65,670)}
const U=r.chart_basis[0],V=r.chart_basis[1],coords=r.chart_direction_coordinates,radius=Math.max(...coords.flat().map(Math.abs),Math.tan(rad(.25)))*1.7;function xy(u,v){return[400+u/radius*280,350-v/radius*280]}function drawZoom(){q.clearRect(0,0,800,700);const step=5;for(let y=70;y<630;y+=step)for(let x=120;x<680;x+=step){let u=(x-400)/280*radius,v=(350-y)/280*radius,ok=N.map(n=>dot(n,R)+u*dot(n,U)+v*dot(n,V)>=0);q.fillStyle=ok.every(Boolean)?'#9be3b1':selected>=0?(ok[selected]?C[selected]+'25':'#fff'):'#fff';q.fillRect(x,y,step,step)}q.strokeStyle='#dfe4eb';q.lineWidth=1;for(let i=-2;i<=2;i++){q.beginPath();q.moveTo(120,350+i*140);q.lineTo(680,350+i*140);q.moveTo(400+i*140,70);q.lineTo(400+i*140,630);q.stroke()}N.forEach((n,i)=>{let a=dot(n,U),b=dot(n,V),c=dot(n,R),pts=[];if(Math.abs(b)>1e-12)for(let u of[-radius,radius]){let v=(-c-a*u)/b;if(Math.abs(v)<=radius)pts.push([u,v])}if(Math.abs(a)>1e-12)for(let v of[-radius,radius]){let u=(-c-b*v)/a;if(Math.abs(u)<=radius)pts.push([u,v])}if(pts.length>=2){q.strokeStyle=C[i];q.lineWidth=2;q.beginPath();q.moveTo(...xy(...pts[0]));q.lineTo(...xy(...pts[1]));q.stroke()}let p=xy(...coords[i]);q.strokeStyle=C[i];q.beginPath();q.moveTo(400,350);q.lineTo(...p);q.stroke();circle(q,p,6,C[i]);q.fillStyle=C[i];q.font='16px system-ui';q.fillText(r.poses[i].replace('_',' '),p[0]+9,p[1]+5+i*7)});star(q,[400,350]);q.fillStyle='#58667a';q.font='15px system-ui';q.fillText('水平／垂直局部角度，窗口 ±'+(Math.atan(radius)*180/Math.PI).toFixed(3)+'°',170,670);if(!r.common_direction_exists)q.fillText('这些半球不存在共同交集；每个彩色点满足自己的半球约束。',120,35)}
function draw(){drawSphere();drawZoom()}let drag=null;A.onpointerdown=e=>{drag=[e.clientX,e.clientY];A.setPointerCapture(e.pointerId)};A.onpointermove=e=>{if(!drag)return;az-=(e.clientX-drag[0])*.008;el=Math.max(-1.5,Math.min(1.5,el+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];drawSphere()};A.onpointerup=()=>drag=null;draw();
</script></html>
