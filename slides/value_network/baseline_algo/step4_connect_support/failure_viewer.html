<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step5 失败形状查看器</title><style>
body{margin:0;background:#ffffff;color:#263639;font:15px system-ui,sans-serif}header{padding:16px 22px;border-bottom:1px solid #ddd}h1{font-size:23px;margin:0 0 9px}.muted{color:#63716c}main{display:grid;grid-template-columns:1fr 330px;height:calc(100vh - 116px)}canvas{width:100%;height:100%;min-height:450px;touch-action:none}aside{padding:18px;border-left:1px solid #ddd;overflow:auto}button,select{font:inherit;padding:8px;margin:5px 3px 5px 0}select,input[type=range]{width:100%}label{display:block;margin:12px 0}a{color:#286b97}p{line-height:1.65}.red{color:#b33333}.tag{background:#eee5df;padding:8px;border-radius:5px}#error{color:#b33333} @media(max-width:750px){main{display:block;height:auto}canvas{height:60vh}aside{border:0}}</style>
<header><h1 id="title"></h1><div id="stage"></div></header><main><canvas id="scene" aria-label="可拖动旋转的实际失败形状"></canvas><aside>
<div class="tag" id="reason"></div><p class="muted">拖动旋转，滚轮缩放。蓝色为实际尝试的支撑材料，绿色为工作面，红色为实际碰撞，橙色为预留间隙不足。所有构件共同移动，物体固定。</p>
<label>查看方向或失败事件<select id="event"></select></label>
<label id="motionLabel">退出演示进度（装入沿反方向）<input id="motion" type="range" min="0" max="1" step="0.005" value="1"></label>
<button id="play">播放失败动作</button><button id="reset">全景</button><button id="focus">放大碰撞处</button>
<label><input id="object" type="checkbox" checked>显示物体</label><label><input id="xray" type="checkbox" checked>物体半透明</label><label><input id="ghost" type="checkbox">显示原位轮廓</label>
<p id="details"></p><p id="parts"></p><p><a href="failure.png">失败对照图</a> · <a href="failure_directions.png">方向对照图</a> · <a href="failure.json">完整诊断</a></p>
<p><a href="failed_shape_mm.stl">支撑形状 STL（毫米）</a><br><a href="failure_pose_mm.stl">失败位置的支撑 STL（毫米）</a><br><a href="workpiece_mm.stl">物体 STL（同一坐标系，毫米）</a></p><p id="error"></p></aside></main>
<script id="data" type="application/json">__DATA__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent),$=x=>document.getElementById(x),canvas=$('scene'),ctx=canvas.getContext('2d');
$('title').textContent=data.title;$('stage').textContent=data.stage;$('reason').textContent=data.reason;
let yaw=-.9,pitch=.5,zoom=1,center=data.center.slice(),active=data.primary_event||0,playing=false,last=0;
const add=(a,b)=>a.map((x,i)=>x+b[i]),mul=(a,k)=>a.map(x=>x*k),dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
for(let i=0;i<data.events.length;i++){let o=document.createElement('option');o.value=i;o.textContent=data.events[i].name;$('event').appendChild(o)}
function current(){return data.events[active]}
$('event').value=active;
function project(v){const q=v.map((x,i)=>x-center[i]),cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);const right=[cy,sy,0],up=[-sy*sp,cy*sp,cp],depth=[sy*cp,-cy*cp,sp];const s=Math.min(canvas.width,canvas.height)*zoom/data.width;return [canvas.width/2+dot(q,right)*s,canvas.height/2-dot(q,up)*s,dot(q,depth)]}
function paint(){const rect=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.round(rect.width*devicePixelRatio));canvas.height=Math.max(1,Math.round(rect.height*devicePixelRatio));ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);const event=current(),f=+$('motion').value,shift=mul(event.translation,f),triangles=[];
 function mesh(m,shift,color,alpha,kind){if(!m)return;const vs=m.v.map(v=>project(add(v,shift)));for(let i=0;i<m.f.length;i++){let ids=m.f[i],p=ids.map(j=>vs[j]);const a=p[1].map((x,k)=>x-p[0][k]),b=p[2].map((x,k)=>x-p[0][k]);let shade=.78+.2*Math.abs((a[0]*b[1]-a[1]*b[0])/(Math.hypot(...a)*Math.hypot(...b)||1));let c=(m.colors&&m.colors[i])||color;triangles.push({p,z:p.reduce((s,v)=>s+v[2],0)/3,c:c.map(x=>Math.round(x*shade)),alpha,kind})}}
 mesh(data.floor,[0,0,0],[220,224,221],.4,'floor');if($('object').checked)mesh(data.object,[0,0,0],[185,190,189],$('xray').checked?.2:1,'object');
 const shape=data.shapes[event.shape||0];for(let i=0;i<shape.length;i++){let c=shape[i].label.startsWith('ground_')?[47,139,143]:[64,119,165];if(f>.999&&event.colliding_parts.includes(i))c=[199,68,53];mesh(shape[i],shift,c,1,'shape');if($('ghost').checked)mesh(shape[i],[0,0,0],[104,145,175],.14,'ghost')}
 triangles.sort((a,b)=>a.z-b.z);for(const t of triangles){ctx.globalAlpha=t.alpha;ctx.fillStyle=`rgb(${t.c.join(',')})`;ctx.beginPath();ctx.moveTo(t.p[0][0],t.p[0][1]);ctx.lineTo(t.p[1][0],t.p[1][1]);ctx.lineTo(t.p[2][0],t.p[2][1]);ctx.closePath();ctx.fill()}ctx.globalAlpha=1;
 if(f>.999&&event.collision){const v=event.collision.v.map(project);ctx.fillStyle=event.clearance_envelope_not_actual_material?'#e79723':'#e22d39';ctx.strokeStyle=event.clearance_envelope_not_actual_material?'#945c14':'#8d1222';ctx.lineWidth=devicePixelRatio;for(const face of event.collision.f){ctx.beginPath();face.forEach((i,k)=>k?ctx.lineTo(v[i][0],v[i][1]):ctx.moveTo(v[i][0],v[i][1]));ctx.closePath();ctx.fill();ctx.stroke()}}
 const root=event.anchor,tail=project(root),tip=project(add(root,mul(event.direction,data.width*.15)));ctx.strokeStyle='#8b4599';ctx.fillStyle='#8b4599';ctx.lineWidth=3*devicePixelRatio;ctx.beginPath();ctx.moveTo(tail[0],tail[1]);ctx.lineTo(tip[0],tip[1]);ctx.stroke();const a=Math.atan2(tip[1]-tail[1],tip[0]-tail[0]),r=12*devicePixelRatio;ctx.beginPath();ctx.moveTo(tip[0],tip[1]);ctx.lineTo(tip[0]-r*Math.cos(a-.45),tip[1]-r*Math.sin(a-.45));ctx.lineTo(tip[0]-r*Math.cos(a+.45),tip[1]-r*Math.sin(a+.45));ctx.closePath();ctx.fill();
 $('details').textContent=event.description+' 当前位移 '+(Math.hypot(...event.translation)*f).toFixed(3)+' mm。';$('parts').textContent='当前文件包含 '+shape.length+' 个构件。'+event.material_note;
 canvas.dataset.rendered='true';canvas.dataset.triangleCount=triangles.length;}
function reset(){center=data.center.slice();zoom=1;yaw=-.9;pitch=.5;paint()}
$('event').onchange=()=>{active=+$('event').value;$('motion').value=1;playing=false;$('play').textContent='播放失败动作';reset()};$('motion').oninput=paint;for(const id of ['object','xray','ghost'])$(id).onchange=paint;
$('reset').onclick=reset;$('focus').onclick=()=>{const e=current();center=e.focus.slice();zoom=Math.min(12,data.width/Math.max(e.focus_width,data.width*.07));paint()};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放失败动作';if(playing){$('motion').value=0;last=performance.now();requestAnimationFrame(tick)}};
function tick(t){if(!playing)return;let value=+$('motion').value+(t-last)/2500;last=t;if(value>=1){value=1;playing=false;$('play').textContent='重新播放'}$('motion').value=value;paint();if(playing)requestAnimationFrame(tick)}
let drag=null;canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag=[e.clientX,e.clientY]};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.007;pitch=Math.max(-1.45,Math.min(1.45,pitch+(e.clientY-drag[1])*.007));drag=[e.clientX,e.clientY];paint()};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.2,Math.min(25,zoom*Math.exp(-e.deltaY*.001)));paint()};window.onresize=paint;try{paint()}catch(e){$('error').textContent='渲染错误：'+e.message;throw e}
</script></html>
