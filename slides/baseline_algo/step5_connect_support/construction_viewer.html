<title>Step5 · 看身体如何长出来</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#263b49;font:15px system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:22px}h1{font-size:26px;margin:0 0 8px}p{color:#647782;line-height:1.6;margin:8px 0}nav,.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:14px 0}button,a,select{font:inherit;border:1px solid #cbd8df;background:white;border-radius:7px;padding:9px 13px;color:#2c495b;text-decoration:none;cursor:pointer}button.active{background:#dcebe6;border-color:#84aaa0}canvas{width:100%;display:block;border-radius:12px;background:white}input[type=range]{flex:1;min-width:200px;accent-color:#407d71}#stage{max-width:460px}#clock{font-variant-numeric:tabular-nums;min-width:90px}.note{font-size:13px}#videos{display:flex;gap:10px;flex-wrap:wrap}
</style></head><body><main>
<h1>Step5 · 看身体如何长出来</h1>
<p>左右是同一件支架的两种摆放。彩色保留接触头，灰白材料逐步出现，金色轮廓指出当前要到达的脚端。</p>
<nav><button data-mode="both" class="active">两个姿态同步看</button><button data-mode="0">Pose 1</button><button data-mode="1">Pose 3</button><button id="object">隐藏工件</button><button id="reset">重置视角</button><a href="index.html">完整实体</a></nav>
<canvas id="display" width="1600" height="900"></canvas>
<div class="controls"><button id="play">播放</button><button id="previous">上一步</button><button id="next">下一步</button><input id="time" aria-label="构造进度" type="range" min="0" step="0.02" value="0"><span id="clock"></span><select id="stage" aria-label="构造步骤"></select></div>
<div id="videos"><a href="construction.mp4">同步视频 · MP4</a><a href="construction_pose1.mp4">Pose 1 · MP4</a><a href="construction_pose3.mp4">Pose 3 · MP4</a></div>
<p class="note">可拖动旋转，滚轮缩放。这是实际新增几何的逐步显现，用来解释构造顺序；不是装配运动或制造过程。</p>
</main><script>__THREE__</script><script>
const DATA=__DATA__;
const display=document.getElementById('display'),ctx=display.getContext('2d'),webgl=document.createElement('canvas');
const renderer=new THREE.WebGLRenderer({canvas:webgl,antialias:true,preserveDrawingBuffer:true});
renderer.setClearColor(0xffffff);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.localClippingEnabled=true;
const scenes=[],chapters=['原始头','局部身体','补充脚端','短连接','完成'];
let time=0,mode='both',playing=false,last=0,theta=-2.35,phi=.5,zoom=1,showObject=true,drag=null;
function geometry(data){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(data.vertices,3));g.setIndex(data.faces);g.computeVertexNormals();return g;}
function material(color){return new THREE.MeshStandardMaterial({color,roughness:.74,metalness:.03,side:THREE.DoubleSide});}
function matrix(pose){const r=pose.rotation,t=pose.translation;return new THREE.Matrix4().set(r[0][0],r[0][1],r[0][2],t[0],r[1][0],r[1][1],r[1][2],t[1],r[2][0],r[2][1],r[2][2],t[2],0,0,0,1);}
function overlay(g,region,color){
 const p=g.attributes.position,n=g.attributes.normal,indices=g.index.array,xyz=[],ns=[];
 function clip(poly,axis,bound,sign){const result=[];for(let j=0;j<poly.length;j++){const a=poly[j],b=poly[(j+1)%poly.length],da=sign*(a.p[axis]-bound),db=sign*(b.p[axis]-bound);if(da>=0)result.push(a);if((da>=0)!==(db>=0)){const t=da/(da-db);result.push({p:a.p.map((v,k)=>v+t*(b.p[k]-v)),n:a.n.map((v,k)=>v+t*(b.n[k]-v))});}}return result;}
 for(let i=0;i<indices.length;i+=3){let poly=[];for(let j=0;j<3;j++){const k=indices[i+j];poly.push({p:[p.getX(k),p.getY(k),p.getZ(k)],n:[n.getX(k),n.getY(k),n.getZ(k)]});}
  if([0,1,2].some(a=>poly.every(v=>v.p[a]<region.low[a])||poly.every(v=>v.p[a]>region.high[a])))continue;
  for(let a=0;a<3&&poly.length;a++){poly=clip(poly,a,region.low[a],1);poly=clip(poly,a,region.high[a],-1);}
  for(let j=1;j+1<poly.length;j++)for(const v of [poly[0],poly[j],poly[j+1]]){xyz.push(...v.p);ns.push(...v.n);}
 }
 const result=new THREE.BufferGeometry();result.setAttribute('position',new THREE.Float32BufferAttribute(xyz,3));result.setAttribute('normal',new THREE.Float32BufferAttribute(ns,3));result.normalizeNormals();return {geometry:result,color};
}
const headGeometries=DATA.heads.map(geometry),fixtureGeometry=geometry(DATA.fixture);
function decorated(g){return {geometry:g,overlays:DATA.head_regions.map(r=>overlay(g,r,DATA.parts.find(p=>p.id===r.id).color))};}
const finalGeometry=decorated(fixtureGeometry),additions=DATA.stages.map(s=>s.mesh?decorated(geometry(s.mesh)):null);
function makeDecorated(record,plane){const group=new THREE.Group(),base=new THREE.Mesh(record.geometry,material(0xc5cecb));group.add(base);for(const item of record.overlays){const m=material(item.color);m.polygonOffset=true;m.polygonOffsetFactor=-1;m.polygonOffsetUnits=-1;const mesh=new THREE.Mesh(item.geometry,m);mesh.renderOrder=1;group.add(mesh);}if(plane)group.traverse(x=>{if(x.material)x.material.clippingPlanes=[plane];});return group;}
function makeScene(index){
 const pose=DATA.poses[index],scene=new THREE.Scene(),fixture=new THREE.Group(),transform=matrix(pose);
 fixture.applyMatrix4(transform);scene.add(fixture);scene.add(new THREE.HemisphereLight(0xffffff,0xa1b2b7,2.1));const light=new THREE.DirectionalLight(0xffffff,2.8);light.position.set(-.3,-.4,.7);scene.add(light);
 const heads=new THREE.Group();headGeometries.forEach((g,i)=>heads.add(new THREE.Mesh(g,material(DATA.heads[i].color))));fixture.add(heads);
 const steps=DATA.stages.map((stage,i)=>{if(!stage.mesh)return null;const plane=new THREE.Plane(),body=makeDecorated(additions[i],plane);fixture.add(body);let target=null;
  if(stage.target_polygon){const g=new THREE.BufferGeometry().setFromPoints(stage.target_polygon.map(p=>new THREE.Vector3(...p)));target=new THREE.LineLoop(g,new THREE.LineBasicMaterial({color:0xd99423,depthTest:false,transparent:true,opacity:.95}));target.renderOrder=5;fixture.add(target);}
  return {body,plane,target};});
 const final=makeDecorated(finalGeometry);fixture.add(final);
 const object=new THREE.Mesh(geometry(pose.object),material(0xa8b9c2));object.material.transparent=true;object.material.opacity=.16;object.material.depthWrite=false;object.renderOrder=3;scene.add(object);
 scene.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(final);bounds.union(new THREE.Box3().setFromObject(object));const center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(.31,.31),new THREE.MeshBasicMaterial({color:0xf0f3f5,side:THREE.DoubleSide}));floor.position.set(center.x,center.y,-.0005);scene.add(floor);
 const grid=new THREE.GridHelper(.30,10,0xdfe6e8,0xe8edef);grid.rotation.x=Math.PI/2;grid.position.set(center.x,center.y,-.00035);scene.add(grid);
 return {scene,fixture,transform,heads,steps,final,object,center,size,bounds,camera:new THREE.OrthographicCamera()};
}
scenes.push(makeScene(0),makeScene(1));
function stageAt(t){let index=0;for(let i=0;i<DATA.stages.length;i++){if(t>=DATA.stages[i].start)index=i;}return index;}
function smooth(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function updateGeometry(t){const index=stageAt(t),stage=DATA.stages[index],fraction=Math.min(1,(t-stage.start)/stage.duration),growth=smooth((fraction-.15)/.67);
 for(const s of scenes){s.heads.visible=stage.kind!=='complete';s.final.visible=stage.kind==='complete';s.object.visible=showObject;
  s.steps.forEach((step,i)=>{if(!step)return;step.body.visible=stage.kind!=='complete'&&i<=index&&(i<index||growth>0);if(step.target)step.target.visible=i===index&&stage.kind!=='complete';
   const event=DATA.stages[i],progress=i<index?1.00001:growth,threshold=event.reveal_min+(event.reveal_max-event.reveal_min)*progress;
   step.plane.set(new THREE.Vector3(...event.axis).negate(),threshold).applyMatrix4(s.transform);
  });
 }
 return {index,stage,fraction,growth};
}
function draw(t=time,view=mode){
 const W=1600,H=900,header=140,footer=105,viewH=H-header-footer,chosen=view==='both'?[0,1]:[Number(view)],viewW=W/chosen.length;
 const state=updateGeometry(t);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
 renderer.setSize(W,viewH,false);renderer.setScissorTest(true);
 for(const [slot,index] of chosen.entries()){
  const s=scenes[index],cam=s.camera,spin=state.stage.kind==='complete'?.65*smooth(state.fraction):0;
  cam.up.set(0,0,1);cam.position.copy(s.center).add(new THREE.Vector3(Math.cos(theta+spin)*Math.cos(phi),Math.sin(theta+spin)*Math.cos(phi),Math.sin(phi)).multiplyScalar(2));cam.lookAt(s.center);cam.updateMatrixWorld(true);
  const projected=new THREE.Box3();for(const x of [s.bounds.min.x,s.bounds.max.x])for(const y of [s.bounds.min.y,s.bounds.max.y])for(const z of [s.bounds.min.z,s.bounds.max.z])projected.expandByPoint(new THREE.Vector3(x,y,z).applyMatrix4(cam.matrixWorldInverse));
  const aspect=viewW/viewH,half=Math.max(Math.abs(projected.min.y),Math.abs(projected.max.y),Math.abs(projected.min.x)/aspect,Math.abs(projected.max.x)/aspect)*1.14/zoom;
  cam.left=-half*aspect;cam.right=half*aspect;cam.top=half;cam.bottom=-half;cam.near=.001;cam.far=10;cam.updateProjectionMatrix();
  renderer.setViewport(slot*viewW,0,viewW,viewH);renderer.setScissor(slot*viewW,0,viewW,viewH);renderer.render(s.scene,cam);
 }
 renderer.setScissorTest(false);ctx.drawImage(webgl,0,header);
 ctx.textAlign='left';ctx.fillStyle='#263f4b';ctx.font='600 28px system-ui';ctx.fillText('Step5 · 局部身体的构造过程',40,42);
 ctx.textAlign='right';ctx.font='22px system-ui';ctx.fillStyle='#778790';ctx.fillText(view==='both'?'同一份几何 · 两个姿态同步':'同一件支架 · '+DATA.poses[Number(view)].name.replace('pose_','Pose '),W-40,42);
 const chipWidth=185,left=40;chapters.forEach((label,i)=>{ctx.fillStyle=i===state.stage.phase?'#dcebe6':'#eff3f5';ctx.fillRect(left+i*(chipWidth+12),61,chipWidth,35);ctx.fillStyle=i===state.stage.phase?'#31675b':'#768791';ctx.font='20px system-ui';ctx.textAlign='center';ctx.fillText(label,left+i*(chipWidth+12)+chipWidth/2,86);});
 for(const [slot,index] of chosen.entries()){ctx.textAlign='center';ctx.font='600 25px system-ui';ctx.fillStyle='#405965';ctx.fillText(DATA.poses[index].name.replace('pose_','Pose '),viewW*(slot+.5),131);}
 if(chosen.length===2){ctx.strokeStyle='#e7edef';ctx.beginPath();ctx.moveTo(W/2,145);ctx.lineTo(W/2,H-footer-5);ctx.stroke();}
 ctx.textAlign='left';ctx.fillStyle='#263f4b';ctx.font='600 26px system-ui';ctx.fillText(`${String(state.index+1).padStart(2,'0')} / ${DATA.stages.length}  ${state.stage.title}`,40,H-76);
 ctx.font='22px system-ui';ctx.fillStyle='#647b87';ctx.fillText(state.stage.detail,40,H-41);
 ctx.fillStyle='#e4ebe9';ctx.fillRect(40,H-19,W-80,5);ctx.fillStyle='#4d897b';ctx.fillRect(40,H-19,(W-80)*t/DATA.duration,5);
 return state;
}
const slider=document.getElementById('time'),select=document.getElementById('stage');slider.max=DATA.duration;
DATA.stages.forEach((s,i)=>select.add(new Option(`${String(i+1).padStart(2,'0')} · ${s.title}`,String(i))));
function seek(t){time=Math.max(0,Math.min(DATA.duration,t));const state=draw();slider.value=time;select.value=state.index;document.getElementById('clock').textContent=`${time.toFixed(1)} / ${DATA.duration.toFixed(1)}s`;return state;}
function pause(){playing=false;document.getElementById('play').textContent='播放';}
function setMode(next){mode=String(next);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));draw();}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.getElementById('play').onclick=()=>{if(playing){pause();return;}if(time>=DATA.duration)seek(0);playing=true;last=performance.now();document.getElementById('play').textContent='暂停';};
function inspectStage(index){pause();const stage=DATA.stages[index];seek(stage.start+stage.duration*.98);}
slider.oninput=()=>{pause();seek(Number(slider.value));};select.onchange=()=>inspectStage(Number(select.value));
document.getElementById('previous').onclick=()=>inspectStage(Math.max(0,stageAt(time)-1));
document.getElementById('next').onclick=()=>inspectStage(Math.min(DATA.stages.length-1,stageAt(time)+1));
document.getElementById('object').onclick=()=>{showObject=!showObject;document.getElementById('object').textContent=showObject?'隐藏工件':'显示工件';draw();};
document.getElementById('reset').onclick=()=>{theta=-2.35;phi=.5;zoom=1;draw();};
display.onpointerdown=e=>{drag=[e.clientX,e.clientY];display.setPointerCapture(e.pointerId);};display.onpointerup=()=>drag=null;
display.onpointermove=e=>{if(!drag)return;theta-=(e.clientX-drag[0])*.007;phi=Math.max(.08,Math.min(1.3,phi+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY];draw();};
display.onwheel=e=>{e.preventDefault();zoom=Math.max(.6,Math.min(2,zoom*Math.exp(-e.deltaY*.001)));draw();};
function tick(now){if(playing){seek(time+(now-last)/1000);last=now;if(time>=DATA.duration)pause();}requestAnimationFrame(tick);}requestAnimationFrame(tick);
window.CONSTRUCTION={data:DATA,seek,setMode,canvas:display,frame:(t,view)=>{draw(t,view);return display.toDataURL('image/png');},state:()=>({time,mode,index:stageAt(time),playing})};seek(0);
</script></body></html>
