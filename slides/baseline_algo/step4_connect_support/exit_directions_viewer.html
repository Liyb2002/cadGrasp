<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pose5+7 · 物体退出方向</title>
<style>body{margin:0;background:#f5f8fa;color:#263d4b;font:16px system-ui}main{max-width:1450px;margin:auto;padding:22px}h1{font-size:26px}p{line-height:1.6}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0}button{padding:9px 15px;background:white;border:1px solid #b7cad4;border-radius:7px;cursor:pointer;color:inherit}button.active{background:#e3edf5;border-color:#6b9fc0}canvas{display:block;background:white;width:100%;height:690px;border-radius:12px;touch-action:none}#wrap{position:relative}#tag{position:absolute;background:#fff8f5;color:#bd3733;border:1px solid #d3423e;padding:5px 9px;border-radius:5px;pointer-events:none}.swatch{display:inline-block;width:13px;height:13px;margin-right:6px;border-radius:3px}input{width:290px}#status{padding:10px;background:white;border-radius:8px}.note{font-size:14px;color:#60727c}</style>
<main><h1>pose5+7：固定接触头，让物体沿箭头退出</h1>
<p>箭头表示<strong>物体运动方向</strong>。切换 pose 后可播放或拖动退出距离；红色标出 C020 处生成的支撑根部。</p>
<nav><button data-pose="common">同一个物体：比较方向</button><button data-pose="0">Pose 5</button><button data-pose="1" class="active">Pose 7</button><button id="play">播放退出</button><button id="reset">重置视角</button></nav>
<nav><span>物体前进</span><input id="distance" type="range" min="0" max="60" step="0.2" value="0"><strong id="value">0 mm</strong><button data-distance="0">起点</button><button data-distance="2">2 mm</button><button data-distance="20">20 mm</button><label><input id="ghost" type="checkbox" checked style="width:auto">显示起始位置</label></nav>
<div id="wrap"><canvas id="view" width="1450" height="800"></canvas><span id="tag">C020 根部（固定）</span></div>
<nav><span><i class="swatch" style="background:#d99530"></i>Pose 5</span><span><i class="swatch" style="background:#9360b4"></i>Pose 7</span><span><i class="swatch" style="background:#aeb8bf"></i>半透明物体</span><span><i class="swatch" style="background:#d3423e"></i>C020 根部（透视显示）</span></nav>
<p id="status"></p><p class="note">拖动旋转，滚轮缩放。彩色接触面保持固定；此图没有完整支撑实体。只核对高亮根部与物体的碰撞，不表示其他头或完整退出已通过。</p></main>
<script>__THREE__</script><script>
const DATA=__DATA__,canvas=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setClearColor(0xffffff);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x8f9ba4,2));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(-.4,-.6,.9);scene.add(light);
function mesh(data,color,opacity=1){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(data.vertices,3));g.setIndex(data.faces);g.computeVertexNormals();return new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:.8,side:THREE.DoubleSide,transparent:opacity<1,opacity,depthWrite:opacity===1}));}
const assembly=new THREE.Group();scene.add(assembly);const object=mesh(DATA.object,0xaeb8bf,.62);assembly.add(object);
const start=mesh(DATA.object,0xd5dce1,.10);assembly.add(start);
for(const p of DATA.parts){const m=mesh(p,p.id===DATA.root_id?0xd3423e:p.color);m.material.depthTest=false;m.renderOrder=2;assembly.add(m);}
const root=mesh(DATA.root,0xd3423e);root.material.depthTest=false;root.renderOrder=3;assembly.add(root);
const bounds=new THREE.Box3().setFromObject(object),center=bounds.getCenter(new THREE.Vector3()),span=bounds.getSize(new THREE.Vector3()).length();
const arrows=DATA.poses.map((p,i)=>{const a=new THREE.ArrowHelper(new THREE.Vector3(...p.object_exit),center,.145,DATA.colors[i],.016,.01);assembly.add(a);return a;});
function label(text,color){const c=document.createElement('canvas');c.width=256;c.height=80;const ctx=c.getContext('2d');ctx.font='bold 38px system-ui';ctx.fillStyle=color;ctx.fillText(text,10,52);const m=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true});const s=new THREE.Sprite(m);s.scale.set(.055,.017,1);s.renderOrder=5;return s;}
const labels=DATA.poses.map((p,i)=>{const s=label(p.name.replace('pose_','Pose '),DATA.colors[i]);s.position.copy(center).addScaledVector(new THREE.Vector3(...p.object_exit),.166);assembly.add(s);return s;});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(.6,.6),new THREE.MeshBasicMaterial({color:0xeef2f4,side:THREE.DoubleSide,transparent:true,opacity:.7}));floor.position.z=-.0004;scene.add(floor);
const camera=new THREE.OrthographicCamera();let current=1,theta=-2.3,phi=.52,zoom=1,drag=null,playing=false,distance=0;
const rootCenter=new THREE.Box3().setFromObject(root).getCenter(new THREE.Vector3());
function draw(){const w=canvas.width,h=canvas.height;renderer.setSize(w,h,false);const focus=center.clone().applyMatrix4(assembly.matrixWorld);const half=span*.68/zoom;camera.left=-half*w/h;camera.right=half*w/h;camera.top=half;camera.bottom=-half;camera.near=.001;camera.far=10;camera.up.set(0,0,1);camera.position.copy(focus).add(new THREE.Vector3(Math.cos(theta)*Math.cos(phi),Math.sin(theta)*Math.cos(phi),Math.sin(phi)).multiplyScalar(2));camera.lookAt(focus);camera.updateProjectionMatrix();renderer.render(scene,camera);const p=rootCenter.clone().applyMatrix4(assembly.matrixWorld).project(camera),tag=document.getElementById('tag');tag.style.left=Math.max(5,Math.min(canvas.clientWidth-160,(p.x+1)/2*canvas.clientWidth+12))+'px';tag.style.top=Math.max(5,Math.min(canvas.clientHeight-35,(1-p.y)/2*canvas.clientHeight+8))+'px';}
function status(){const e=document.getElementById('status');if(current===null){e.textContent='两个箭头已经转换到同一个物体参照；此模式物体不移动。';return;}const samples=DATA.collision_samples[current].samples;const exact=samples.find(r=>Math.abs(r.distance_mm-distance)<1e-6);if(exact){e.textContent=DATA.poses[current].name.replace('pose_','Pose ')+'：前进 '+distance.toFixed(1)+' mm；C020 根部与物体重叠体积 '+(exact.root_overlap_fraction*100).toFixed(1)+'%。';e.style.color=exact.root_overlap_fraction>1e-6?'#b93230':'#405768';}else{e.textContent='当前前进 '+distance.toFixed(1)+' mm。已核对：Pose 7 前进 2 mm 时，C020 根部完全落入物体内部。';e.style.color='#405768';}}
function setDistance(mm){distance=Math.max(0,Math.min(60,Number(mm)));document.getElementById('distance').value=distance;document.getElementById('value').textContent=distance.toFixed(1)+' mm';object.position.set(0,0,0);if(current!==null)object.position.addScaledVector(new THREE.Vector3(...DATA.poses[current].object_exit),distance/1000);start.visible=current!==null&&document.getElementById('ghost').checked&&distance>0;status();draw();}
function setPose(value){current=value==='common'?null:Number(value);playing=false;document.getElementById('play').textContent='播放退出';assembly.position.set(0,0,0);assembly.quaternion.identity();assembly.scale.set(1,1,1);assembly.updateMatrix();if(current!==null){const p=DATA.poses[current],r=p.rotation,o=p.offset,t=r.map(row=>-row.reduce((s,v,j)=>s+v*o[j],0));assembly.applyMatrix4(new THREE.Matrix4().set(r[0][0],r[0][1],r[0][2],t[0],r[1][0],r[1][1],r[1][2],t[1],r[2][0],r[2][1],r[2][2],t[2],0,0,0,1));}assembly.updateMatrixWorld(true);floor.visible=current!==null;arrows.forEach((a,i)=>a.visible=current===null||i===current);labels.forEach((a,i)=>a.visible=current===null||i===current);document.querySelectorAll('[data-pose]').forEach(b=>b.classList.toggle('active',b.dataset.pose===value));document.getElementById('distance').disabled=current===null;document.getElementById('play').disabled=current===null;setDistance(0);}
document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>setPose(b.dataset.pose));document.querySelectorAll('[data-distance]').forEach(b=>b.onclick=()=>{playing=false;document.getElementById('play').textContent='播放退出';setDistance(b.dataset.distance);});document.getElementById('distance').oninput=e=>{playing=false;document.getElementById('play').textContent='播放退出';setDistance(e.target.value);};document.getElementById('ghost').onchange=()=>setDistance(distance);document.getElementById('play').onclick=()=>{playing=!playing;if(distance>=60)setDistance(0);document.getElementById('play').textContent=playing?'暂停':'播放退出';};document.getElementById('reset').onclick=()=>{theta=-2.3;phi=.52;zoom=1;draw();};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;theta-=(e.clientX-drag[0])*.007;phi=Math.max(-1.35,Math.min(1.35,phi+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY];draw();};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.3,Math.min(5,zoom*Math.exp(-e.deltaY*.001)));draw();};
let previous=null;function animate(now){if(playing&&current!==null&&previous!==null){setDistance(Math.min(60,distance+(now-previous)*.008));if(distance>=60){playing=false;document.getElementById('play').textContent='播放退出';}}previous=now;requestAnimationFrame(animate);}setPose('1');requestAnimationFrame(animate);
</script></html>
